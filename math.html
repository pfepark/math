<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연산 방청소 - 초등 수학 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F8FF; --card:#FFFFFF; --ink:#3B3A36; --sub:#7A756B;
    --accent:#FF9F1C; --accent2:#FF6B35; --line:#E3E9F2;
    --good:#0E7C4A; --bad:#C0392B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(255,159,28,.12), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(100,181,246,.10), transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family:'Gowun Dodum','맑은 고딕',sans-serif;
    min-height:100vh; padding:18px 24px 34px;
  }
  .wrap{max-width:840px; margin:0 auto;}
  header{display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap;}
  header h1{font-family:'Jua',sans-serif; font-size:clamp(22px,4vw,34px); color:var(--accent2); letter-spacing:1px;}
  header .total{
    margin-left:auto; font-size:13.5px; color:var(--sub); background:#fff;
    border:1px solid var(--line); border-radius:999px; padding:5px 14px; white-space:nowrap;
  }
  a.btn-menu{
    font-family:'Jua',sans-serif; font-size:15px; text-decoration:none; color:#3B6BB5;
    background:#EDF2FA; border-radius:12px; padding:8px 16px; transition:.15s; display:inline-block;
  }
  a.btn-menu:hover{transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,.12);}
  .card{
    background:var(--card); border-radius:20px; padding:14px 16px;
    box-shadow:0 6px 24px rgba(60,90,140,.12); margin-bottom:18px;
  }
  .room-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; padding:0 4px;}
  .room-name{font-family:'Jua',sans-serif; font-size:20px; white-space:nowrap;}
  .progress-wrap{flex:1; min-width:150px; height:16px; background:#EDF2FA; border:1px solid var(--line);
    border-radius:999px; overflow:hidden;}
  .progress-bar{height:100%; width:0; background:linear-gradient(90deg,#8CE99A,#51CF66); transition:width .5s;}
  .remain{font-size:13.5px; color:var(--sub); white-space:nowrap;}

  .room{position:relative; border-radius:14px; overflow:hidden; height:min(60vw,420px); min-height:280px; background:#E8E2D8;}
  .room-bg{
    position:absolute; inset:0;
    background:url('Room.PNG') center 62% / cover no-repeat;
    filter:brightness(.8) saturate(.5) sepia(.18);
    transition:filter .6s ease;
  }
  .bin{
    position:absolute; right:4.5%; bottom:3%; font-size:clamp(28px,7vw,40px); z-index:5;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.2)); line-height:1;
  }
  .item{position:absolute; z-index:3; line-height:1; user-select:none; filter:drop-shadow(0 3px 3px rgba(0,0,0,.2));}
  .item.target::before{
    content:''; position:absolute; inset:-9px; border:3px dashed var(--accent);
    border-radius:50%; animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1); opacity:.9;} 50%{transform:scale(1.12); opacity:.5;}}
  .spark{position:absolute; z-index:6; font-size:20px; pointer-events:none; line-height:1;}
  .rain{position:absolute; bottom:5%; z-index:9; pointer-events:none; line-height:1;}

  .done-overlay{
    position:absolute; inset:0; z-index:8; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.72); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .5s;
  }
  .done-overlay.show{opacity:1; pointer-events:auto;}
  .done-box{text-align:center; padding:22px;}
  .done-box .big{font-size:46px; margin-bottom:8px;}
  .done-box h2{font-family:'Jua',sans-serif; font-size:32px; color:var(--accent2); margin-bottom:8px;}
  .done-box p{color:var(--sub); font-size:15px;}
  .done-box .stats{font-size:13.5px; margin:10px 0 18px;}
  .done-box button{
    font-family:'Jua',sans-serif; font-size:17px; border:none; border-radius:14px; cursor:pointer;
    background:var(--accent); color:#fff; padding:12px 26px; box-shadow:0 4px 0 #C77400; transition:.12s;
  }
  .done-box button:active{transform:translateY(3px); box-shadow:0 1px 0 #C77400;}
  .btn-level{
    font-family:'Jua',sans-serif; font-size:14px; border:none; border-radius:12px; cursor:pointer;
    background:#FFF3DC; color:#B25E00; padding:8px 14px; box-shadow:0 3px 0 #E8CFA0; transition:.12s;
  }
  .btn-level:active{transform:translateY(2px); box-shadow:0 1px 0 #E8CFA0;}
  .level-overlay{
    position:absolute; inset:0; z-index:11; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.85); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .4s;
  }
  .level-overlay.show{opacity:1; pointer-events:auto;}
  .level-box{text-align:center; padding:16px;}
  .level-box h3{font-family:'Jua',sans-serif; font-size:20px; color:var(--accent2); margin-bottom:4px;}
  .level-sub{font-size:13px; color:var(--sub); margin-bottom:12px;}
  .level-btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .level-btns button{
    font-family:'Jua',sans-serif; font-size:18px; border:none; border-radius:14px; cursor:pointer;
    background:#FFF3DC; color:#7A5B12; box-shadow:0 3px 0 #E8CFA0; padding:14px 16px;
    transition:.12s; line-height:1.5; display:flex; flex-direction:column; gap:4px; align-items:center;
  }
  .level-btns button small{font-size:11.5px; font-family:'Gowun Dodum'; color:#9A8558; font-weight:normal;}
  .level-btns button:active{transform:translateY(2px); box-shadow:0 1px 0 #E8CFA0;}
  .level-close{margin-top:12px; border:none; background:none; font-family:'Jua',sans-serif; font-size:14px; color:var(--sub); cursor:pointer; text-decoration:underline;}

  .prob-head{display:flex; justify-content:space-between; align-items:center; max-width:480px; margin:2px auto 6px;}
  .tag{background:#EDF2FA; border-radius:999px; padding:4px 14px; font-size:13.5px; color:#3B6BB5; font-family:'Jua',sans-serif;}
  .streak{font-family:'Jua',sans-serif; font-size:16px; color:var(--accent2); min-height:24px;}
  .problem{font-family:'Jua',sans-serif; font-size:clamp(30px,7vw,46px); text-align:center; margin:2px 0 12px; letter-spacing:2px;}
  .answer-row{display:flex; justify-content:center; align-items:center; gap:12px; margin-bottom:6px; flex-wrap:wrap;}
  .answer-box{
    width:min(300px,64vw); height:64px; text-align:center;
    border:3px solid var(--line); border-radius:14px; background:#FBFDFF;
    font-family:'Jua',sans-serif; font-size:36px; color:var(--accent2);
    outline:none; caret-color:var(--accent2);
  }
  .answer-box:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,159,28,.18);}
  .answer-box::placeholder{color:#C9BFA8; opacity:1;}
  .btn-submit{
    font-family:'Jua',sans-serif; font-size:20px; border:none; border-radius:14px; cursor:pointer;
    background:var(--accent); color:#fff; padding:17px 26px; box-shadow:0 4px 0 #C77400; transition:.12s;
    touch-action:manipulation; user-select:none;
  }
  .btn-submit:active{transform:translateY(3px); box-shadow:0 1px 0 #C77400;}
  .feedback{text-align:center; font-size:15px; min-height:28px; margin:4px 0 14px; color:var(--sub);}
  .feedback.good{color:var(--good); font-weight:bold;}
  .feedback.bad{color:var(--bad);}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);}}
  .shake{animation:shake .32s;}
  footer{max-width:840px; margin:6px auto 0; text-align:center; color:var(--sub); font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="index.html" class="btn-menu">← 메뉴</a>
    <h1>🧹 연산 방청소</h1>
    <button id="btnLevel" class="btn-level">📚 난이도</button>
    <span class="total" id="totalInfo"></span>
  </header>

  <section class="card">
    <div class="room-head">
      <span class="room-name" id="roomName"></span>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <span class="remain" id="remain"></span>
    </div>
    <div class="room" id="room">
      <div class="room-bg" id="roomBg"></div>
      <div class="bin" id="bin">🗑️</div>
      <div class="done-overlay" id="doneOverlay">
        <div class="done-box">
          <div class="big">✨🧹✨</div>
          <h2>대청소 완료!</h2>
          <p id="doneMsg"></p>
          <p class="stats" id="doneStats"></p>
          <button id="btnNextRoom">다음 방 청소하러 가기 🧹</button>
        </div>
      </div>
      <div class="level-overlay" id="levelOverlay">
        <div class="level-box">
          <h3>📚 몇 학년 문제로 시작할까요?</h3>
          <p class="level-sub">학년에 맞는 방부터 시작해요! 방을 청소할 때마다 조금씩 어려워져요.</p>
          <div class="level-btns">
            <button data-lv="3">🌱 3학년<small>덧셈·뺄셈, 구구단 곱셈·나눗셈</small></button>
            <button data-lv="4">🌿 4학년<small>두 자리 곱셈·나눗셈, 큰 수, 소수</small></button>
            <button data-lv="5">🌳 5학년<small>소수 곱셈·나눗셈, 혼합 계산</small></button>
          </div>
          <button class="level-close" id="btnLevelClose" hidden>이어서 하기</button>
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="prob-head">
      <span class="tag" id="qType"></span>
      <span class="streak" id="streak"></span>
    </div>
    <div class="problem" id="problem"></div>
    <div class="answer-row">
      <input class="answer-box" id="answerBox" type="text" inputmode="decimal" maxlength="7" autocomplete="off" placeholder="?" aria-label="정답 입력" />
      <button class="btn-submit" id="btnSubmit">✓ 확인</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </section>

  <footer>물건에 둘러싸인 점선이 다음에 치울 물건이에요! 문제를 맞히면 방이 깨끗해져요 (3~5학년 수준)</footer>
</div>
<script>
"use strict";
/* ====== 유틸 & 효과음 ====== */
const $=id=>document.getElementById(id);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
let AC=null;
function tone(f,t0,dur,type='sine',vol=.07){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,AC.currentTime+t0);
    g.gain.exponentialRampToValueAtTime(vol,AC.currentTime+t0+.015);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t0+dur);
    o.connect(g);g.connect(AC.destination);
    o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+dur+.05);
  }catch(e){}
}
const sfx={
  ok(){tone(660,0,.12);tone(880,.1,.16);},
  no(){tone(196,0,.22,'square',.045);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.2));}
};

/* ====== 방 설정 ====== */
const ROOMS=[
 {hue:0,   items:['🧸','⚽','🚗','🧩','🎮','📚','🧦','🎨','🪀','🎲']},
 {hue:16,  items:['👕','🧦','🧸','📚','🖍️','🎒','⌚','🪁','🧣','🩰']},
 {hue:-14, items:['🍕','🥤','🍪','🍩','🧃','🥄','🍎','🍗','🧁','🥠']},
 {hue:26,  items:['📚','✏️','📐','🖍️','📎','📔','🧮','✂️','📌','🗒️']},
 {hue:-24, items:['📦','🧳','🪀','🪁','🎁','🎮','🎲','🥁','🪆','🎺']},
 {hue:10,  items:['🍂','🍃','⚽','🪁','🐕','🐌','🚲','🧺','🪃','🥏']},
];
const SLOTS=[
 {x:8,y:52,s:1.0,r:-12},{x:22,y:44,s:.95,r:8},{x:36,y:70,s:1.1,r:-5},
 {x:50,y:58,s:1.0,r:14},{x:64,y:47,s:.95,r:-10},{x:78,y:72,s:.9,r:6},
 {x:88,y:55,s:1.05,r:4},{x:15,y:85,s:.9,r:-14},{x:42,y:86,s:1.0,r:10},{x:60,y:82,s:1.0,r:-6}
];
const ITEMS_PER_ROOM=8;

/* ====== 상태 ====== */
const LEVEL_ROOM={3:1,4:4,5:10};
let curLevel=parseInt(localStorage.getItem('cleanLevel')||'0',10)||0;
let roomNum=curLevel?LEVEL_ROOM[curLevel]:1;
let messy=[];
let cleanedCount=0;
let roomHue=0;
let totalClean=parseInt(localStorage.getItem('cleanTotal')||'0',10)||0;
let problem=null, attempts=0, streak=0, bestStreak=0, busy=false;

const roomEl=$('room'), roomBgEl=$('roomBg'), binEl=$('bin'), feedbackEl=$('feedback'),
      answerEl=$('answerBox'), problemEl=$('problem'), streakEl=$('streak');

/* ====== 방 꾸미기 ====== */
function setupRoom(){
  const cfg=ROOMS[(roomNum-1)%ROOMS.length];
  roomHue=cfg.hue;
  roomEl.querySelectorAll('.item,.decor').forEach(e=>e.remove());
  $('roomName').textContent=`🧹 ${roomNum}번째 방`;
  const slots=shuffle(SLOTS).slice(0,ITEMS_PER_ROOM);
  const emos=shuffle(cfg.items).slice(0,ITEMS_PER_ROOM);
  messy=[];
  emos.forEach((e,i)=>{
    const s=document.createElement('span');
    s.className='item'; s.textContent=e;
    s.style.left=slots[i].x+'%'; s.style.top=slots[i].y+'%';
    s.style.transform=`rotate(${slots[i].r}deg)`;
    s.style.fontSize=(38*slots[i].s)+'px';
    roomEl.appendChild(s);
    messy.push({el:s,emoji:e});
  });
  cleanedCount=0; bestStreak=0;
  updateHead(); markTarget(); nextProblem();
}
function updateHead(){
  $('progressBar').style.width=(cleanedCount/ITEMS_PER_ROOM*100)+'%';
  $('remain').textContent=`🧺 남은 물건 ${ITEMS_PER_ROOM-cleanedCount}개`;
  $('totalInfo').textContent=`🏆 누적 ${totalClean}개 정리`;
  const t=cleanedCount/ITEMS_PER_ROOM;
  const b=(.8+.3*t).toFixed(2), sa=(.5+.6*t).toFixed(2), sp=(.18*(1-t)).toFixed(2);
  roomBgEl.style.filter=`brightness(${b}) saturate(${sa}) sepia(${sp}) hue-rotate(${roomHue}deg)`;
}
function markTarget(){
  messy.forEach((m,i)=>m.el.classList.toggle('target', i===cleanedCount && cleanedCount<ITEMS_PER_ROOM));
}

/* ====== 문제 만들기 (3~4학년) ====== */
function genProblem(r){
  const T = r===1?['add','sub']
          : r===2?['mul1','div1']
          : r===3?['add','sub','mul1']
          : r===4?['mul2','div2','add','sub']
          : r<=6?['mixed','mul2','div2','add','sub']
          : r<=9?['decadd','decsub','mixed','mul2','div2']
          : ['decmul','decdiv','decadd','decsub','mixed'];
  const t=T[ri(0,T.length-1)];
  switch(t){
    case 'add':{
      const d = r===1?ri(2,3) : r<=3?3 : r<=5?ri(3,4) : ri(3,5);
      const a=ri(10**(d-1),10**d-1), b=ri(10**(d-1),10**d-1);
      return {text:`${a} + ${b}`, answer:a+b, type:'덧셈',
        hint:'일의 자리부터 차례로 더해요. 자리가 넘어가면 받아올려요!'};
    }
    case 'sub':{
      const d = r===1?ri(2,3) : r<=3?3 : r<=5?ri(3,4) : ri(3,5);
      let a=ri(10**(d-1),10**d-1), b=ri(10**(d-1),10**d-1);
      if(b>a)[a,b]=[b,a];
      if(a===b)b--;
      return {text:`${a} − ${b}`, answer:a-b, type:'뺄셈',
        hint:'일의 자리부터 빼요. 빼려는 수가 크면 윗자리에서 빌려와요!'};
    }
    case 'mul1':{
      const a = r>=3&&Math.random()<.4 ? ri(101,999) : ri(11,99);
      const b=ri(2,9);
      return {text:`${a} × ${b}`, answer:a*b, type:'곱셈',
        hint:'일의 자리부터 곱해서 자리에 맞게 더해요!'};
    }
    case 'mul2':{
      let a=ri(11,59), b=ri(11,39);
      if(b%10===0)b++;
      return {text:`${a} × ${b}`, answer:a*b, type:'곱셈(두 자리)',
        hint:`${a}×${b} = ${a}×${Math.floor(b/10)*10} + ${a}×${b%10} 로 나눠서 곱해요!`};
    }
    case 'div1':{
      const b=ri(2,9), q=ri(2,9);
      return {text:`${b*q} ÷ ${b}`, answer:q, type:'나눗셈',
        hint:`구구단을 떠올려요! 몇 × ${b} = ${b*q}일까요?`};
    }
    case 'div2':{
      const b=ri(2,9), q=ri(11,99);
      return {text:`${b*q} ÷ ${b}`, answer:q, type:'나눗셈',
        hint:`십의 자리 몫부터 구하고, 남은 수를 ${b}로 나눠요.`};
    }
    case 'decmul':{
      const a10=ri(11,99), b=ri(2,9);
      return {text:`${a10/10} × ${b}`, answer:a10*b/10, type:'소수 곱셈',
        hint:'소수점을 잠시 빼고 자연수처럼 곱한 다음, 자릿수에 맞춰 소수점을 다시 찍어요!'};
    }
    case 'decdiv':{
      const b=ri(2,9), q10=ri(11,99);
      const d10=b*q10;
      return {text:`${d10/10} ÷ ${b}`, answer:q10/10, type:'소수 나눗셈',
        hint:'자연수처럼 나누고, 몫의 자릿수에 소수점을 맞춰요!'};
    }
    case 'decadd':{
      const a10=ri(11,499), b10=ri(11,499);
      return {text:`${a10/10} + ${b10/10}`, answer:(a10+b10)/10, type:'소수 덧셈',
        hint:'소수점끼리 일렬로 맞춰 더해요! (0.1의 자리끼리 더해요)'};
    }
    case 'decsub':{
      let a10=ri(11,499), b10=ri(11,499);
      if(b10>a10)[a10,b10]=[b10,a10];
      if(a10===b10)b10-=ri(1,9);
      return {text:`${a10/10} − ${b10/10}`, answer:(a10-b10)/10, type:'소수 뺄셈',
        hint:'소수점 아래 자리를 맞춰서 빼요! (0.1의 자리끼리)'};
    }
    case 'mixed':{
      const k=ri(1,3);
      if(k===1){const a=ri(2,50),b=ri(2,9),c=ri(2,20);
        return {text:`${a} + ${b} × ${c}`, answer:a+b*c, type:'혼합 계산',
          hint:'곱셈을 먼저 계산해요!'};
      }
      if(k===2){const b=ri(2,9),c=ri(2,9),d=ri(2,40);
        return {text:`${b*c+d} − ${b} × ${c}`, answer:d, type:'혼합 계산',
          hint:'곱셈 먼저! 그다음에 빼기예요!'};
      }
      const a=ri(2,9),b=ri(2,9),c=ri(2,9);
      return {text:`(${a} + ${b}) × ${c}`, answer:(a+b)*c, type:'혼합 계산',
        hint:'괄호 안을 먼저 계산해요!'};
    }
  }
}

/* ====== 중복 문제 방지 ====== */
let recentSigs=[];
function uniqueProblem(r){
  let p,tries=0;
  do{ p=genProblem(r); tries++; }
  while(tries<80 && recentSigs.includes(p.text));
  recentSigs.push(p.text);
  if(recentSigs.length>16) recentSigs.shift();
  return p;
}

/* ====== 문제 흐름 ====== */
function nextProblem(){
  problem=uniqueProblem(roomNum);
  attempts=0;
  problemEl.textContent=problem.text+' =';
  $('qType').textContent=problem.type;
  answerEl.value='';
  setFeedback('정답을 적고 ✓ 확인을 눌러요!');
  focusAnswer();
}
function focusAnswer(){
  if(window.matchMedia('(pointer:fine)').matches) answerEl.focus();
}
function setFeedback(t,cls){feedbackEl.textContent=t; feedbackEl.className='feedback'+(cls?' '+cls:'');}
function shake(el){el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');}

function submit(){
  if(busy)return;
  const v=answerEl.value;
  if(v===''){shake(answerEl); setFeedback('정답을 먼저 적어요!'); return;}
  if(Math.abs(Number(v)-problem.answer)<1e-9)onCorrect();
  else onWrong();
}

function onCorrect(){
  busy=true;
  streak++; bestStreak=Math.max(bestStreak,streak);
  streakEl.textContent=streak>=2?`🔥 연속 정답 ${streak}개!`:'';
  sfx.ok();
  totalClean++; localStorage.setItem('cleanTotal',String(totalClean));
  const target=messy[cleanedCount];
  setFeedback(`🎉 정답! ${target.emoji} 을(를) 치웠어요!`,'good');
  cleanItem(target,()=>{
    cleanedCount++;
    updateHead(); markTarget();
    busy=false;
    if(cleanedCount>=ITEMS_PER_ROOM)roomComplete();
    else nextProblem();
  });
}
function onWrong(){
  streak=0; streakEl.textContent='';
  attempts++; sfx.no(); shake(answerEl);
  answerEl.value='';
  if(attempts===1){
    setFeedback('앗, 아쉬워요! 다시 한번 생각해 보세요.','bad');
  }else if(attempts===2){
    setFeedback(`💡 힌트: ${problem.hint}`,'bad');
  }else{
    busy=true;
    setFeedback(`정답은 ${problem.answer}! 잠깐 보고 다음 문제로 넘어가요…`,'bad');
    setTimeout(()=>{
      busy=false;
      nextProblem();
    },1900);
  }
}

/* ====== 청소 애니메이션 ====== */
function cleanItem(target,done){
  const el=target.el;
  el.classList.remove('target');
  const sxp=el.offsetLeft, syp=el.offsetTop;
  const bx=binEl.offsetLeft+binEl.offsetWidth/2, by=binEl.offsetTop+binEl.offsetHeight/2;
  for(let i=0;i<3;i++)sparkAt(sxp+el.offsetWidth/2, syp+el.offsetHeight/2, i);
  const anim=el.animate(
    [{left:sxp+'px', top:syp+'px', transform:el.style.transform, opacity:1},
     {left:(bx-el.offsetWidth/2)+'px', top:(by-el.offsetHeight/2)+'px',
      transform:'rotate(40deg) scale(.2)', opacity:.35}],
    {duration:620, easing:'ease-in', fill:'forwards'});
  anim.onfinish=()=>{
    el.remove();
    binEl.animate([{transform:'scale(1)'},{transform:'scale(1.3) rotate(-8deg)'},{transform:'scale(1)'}],
      {duration:300});
    done&&done();
  };
}
function sparkAt(x,y,i){
  const s=document.createElement('span');
  s.className='spark'; s.textContent='✨';
  s.style.left=(x-10+ri(-14,14))+'px'; s.style.top=(y-10+ri(-14,14))+'px';
  roomEl.appendChild(s);
  s.animate(
    [{transform:'scale(.4)', opacity:0},
     {transform:'scale(1.3)', opacity:1, offset:.4},
     {transform:'scale(.7)', opacity:0}],
    {duration:520+i*90}).onfinish=()=>s.remove();
}
function rainEmoji(n){
  const E=['✨','🎉','⭐','🎈','💫','🎊'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span');
    s.className='rain'; s.textContent=E[i%E.length];
    s.style.left=(4+Math.random()*92)+'%';
    s.style.fontSize=(18+Math.random()*18)+'px';
    roomEl.appendChild(s);
    s.animate(
      [{transform:'translateY(0)', opacity:0},
       {opacity:1, offset:.25},
       {transform:`translateY(-${180+Math.random()*140}px)`, opacity:0}],
      {duration:1500+Math.random()*900, delay:i*110, easing:'ease-out'})
      .onfinish=()=>s.remove();
  }
}
function roomComplete(){
  busy=true;
  sfx.win();
  $('doneMsg').textContent=`${roomNum}번째 방이 반짝반짝! 다음 방은 문제가 조금 더 어려워져요.`;
  $('doneStats').textContent=`이번 방 최고 연속 정답 ${bestStreak}개 · 누적 ${totalClean}개 정리`;
  $('doneOverlay').classList.add('show');
  rainEmoji(12);
}
$('btnNextRoom').addEventListener('click',()=>{
  $('doneOverlay').classList.remove('show');
  roomNum++;
  busy=false;
  setupRoom();
});

/* ====== 난이도 선택 ====== */
function showLevelPicker(){
  $('btnLevelClose').hidden=!curLevel;
  $('levelOverlay').classList.add('show');
  busy=true;
}
function pickLevel(lv){
  localStorage.setItem('cleanLevel',String(lv));
  curLevel=lv;
  roomNum=LEVEL_ROOM[lv];
  $('levelOverlay').classList.remove('show');
  $('doneOverlay').classList.remove('show');
  busy=false;
  setupRoom();
  setHint(`${lv}학년 문제로 시작! 방을 청소할 때마다 조금씩 어려워져요.`);
}
document.querySelectorAll('#levelOverlay [data-lv]').forEach(b=>b.addEventListener('click',()=>pickLevel(+b.dataset.lv)));
$('btnLevelClose').addEventListener('click',()=>{
  $('levelOverlay').classList.remove('show');
  busy=$('doneOverlay').classList.contains('show');
});
$('btnLevel').addEventListener('click',showLevelPicker);

/* ====== 입력 처리 ====== */
answerEl.addEventListener('input',()=>{
  let v=answerEl.value.replace(/[^\d.]/g,'');
  const i=v.indexOf('.');
  if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'');
  answerEl.value=v.slice(0,7);
});
answerEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault(); submit();}
});
$('btnSubmit').addEventListener('click',submit);

/* ====== 시작 ====== */
setupRoom();
if(!curLevel) showLevelPicker();
</script>
